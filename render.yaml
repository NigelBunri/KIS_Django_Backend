services:
  - type: web
    name: kis-django-backend
    runtime: python

    plan: free

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: |
      gunicorn config.wsgi:application

    envVars:

      - key: DJANGO_ENV
        value: production

      - key: DEBUG
        value: False

      - key: USE_X_FORWARDED_PROTO
        value: True

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: DEV_SERVER_HOST
        value: your-django-service.onrender.com

      - key: ALLOWED_HOSTS
        value: your-django-service.onrender.com,localhost,127.0.0.1

      - key: SITE_URL
        value: https://your-django-service.onrender.com

      - key: API_BASE_URL
        value: https://your-django-service.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-django-service.onrender.com

      - key: DATABASE_URL
        sync: false

      - key: DJANGO_INTERNAL_TOKEN
        generateValue: true

      - key: JWT_ISSUER
        value: https://your-django-service.onrender.com

      - key: JWT_AUDIENCE
        value: messaging-platform